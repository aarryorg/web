                            </div>
                            <!-- Status Badge -->
                            <span class="inline-flex items-center px-3 py-1 text-xs font-medium rounded-full ${statusColor}">

                            </span>
                        </div>
                        
                        <!-- Title and Description -->

                            ${data.title}
                        </h2>
                        <p class="text-gray-600 mb-6 text-sm">
                            ${data.description}
                        </p>

                        <!-- Call to Action Link -->

                            Read Resource
                            <!-- Arrow Icon -->
                            <svg class="w-4 h-4 ml-1 transform transition-transform duration-300 group-hover:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                        </div>
                    </div>
                </a>
            `;
        }

        // Render all cards on the page load
